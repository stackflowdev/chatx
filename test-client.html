<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .status {
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff4444;
        }
        .status-dot.connected {
            background: #44ff44;
        }
        .login-form {
            padding: 20px;
            display: flex;
            gap: 10px;
        }
        .login-form input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .login-form button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-form button:hover {
            background: #5568d3;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .message.system {
            background: #fff3cd;
            color: #856404;
            font-style: italic;
        }
        .message .username {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        .message .content {
            color: #333;
        }
        .message .time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .input-area button:hover {
            background: #5568d3;
        }
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .typing-indicator {
            padding: 10px 20px;
            font-size: 13px;
            color: #667eea;
            font-style: italic;
            min-height: 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }
        .typing-indicator.active {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chat Application</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="login-form" id="loginForm">
            <input type="text" id="usernameInput" placeholder="Ismingizni kiriting..." />
            <input type="text" id="roomInput" placeholder="Xona (default: general)" />
            <button onclick="connect()">Ulang</button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="typing-indicator" id="typingIndicator"></div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Xabar yozing..." disabled />
            <button id="sendBtn" onclick="sendMessage()" disabled>Yuborish</button>
        </div>
    </div>

    <script>
        let ws = null;
        let username = "";
        let room = "";
        let typingTimeout = null;
        let typingUsers = new Set();
        let typingHideTimeouts = {};

        function connect() {
            username = document.getElementById('usernameInput').value.trim();
            room = document.getElementById('roomInput').value.trim() || 'general';

            if (!username) {
                alert('Iltimos ismingizni kiriting!');
                return;
            }

            const wsUrl = `ws://localhost:8080/ws?username=${encodeURIComponent(username)}&room=${encodeURIComponent(room)}`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                updateStatus(true);
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                addSystemMessage(`${room} xonasiga ulandingiz`);
            };

            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                addMessage(message);
            };

            ws.onclose = function() {
                updateStatus(false);
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                addSystemMessage('Aloqa uzildi');
            };

            ws.onerror = function(error) {
                console.error('WebSocket xatosi:', error);
                addSystemMessage('Xatolik yuz berdi');
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !ws) return;

            const message = {
                type: 'chat',
                content: content,
                username: username,
                room_id: room,
                timestamp: Math.floor(Date.now() / 1000)
            };

            ws.send(JSON.stringify(message));
            input.value = '';
        }

        function sendTyping() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const typingMsg = {
                type: 'typing',
                username: username,
                room_id: room,
                timestamp: Math.floor(Date.now() / 1000)
            };
            
            ws.send(JSON.stringify(typingMsg));
        }

        function showTypingIndicator(user) {
            if (user === username) return;
            
            typingUsers.add(user);
            updateTypingDisplay();
            
            if (typingHideTimeouts[user]) {
                clearTimeout(typingHideTimeouts[user]);
            }
            
            typingHideTimeouts[user] = setTimeout(() => {
                typingUsers.delete(user);
                updateTypingDisplay();
            }, 3000);
        }

        function updateTypingDisplay() {
            const indicator = document.getElementById('typingIndicator');
            
            if (typingUsers.size === 0) {
                indicator.textContent = '';
                indicator.classList.remove('active');
            } else if (typingUsers.size === 1) {
                const user = Array.from(typingUsers)[0];
                indicator.textContent = `${user} yozyapti...`;
                indicator.classList.add('active');
            } else if (typingUsers.size === 2) {
                const users = Array.from(typingUsers);
                indicator.textContent = `${users[0]} va ${users[1]} yozyapti...`;
                indicator.classList.add('active');
            } else {
                indicator.textContent = `${typingUsers.size} kishi yozyapti...`;
                indicator.classList.add('active');
            }
        }

        function addMessage(message) {
            if (message.type === 'typing') {
                showTypingIndicator(message.username);
                return;
            }
            
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            if (message.type === 'join' || message.type === 'leave') {
                messageDiv.classList.add('system');
                messageDiv.innerHTML = `
                    <div class="content">${message.content}</div>
                    <div class="time">${formatTime(message.timestamp)}</div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="username">${message.username}</div>
                    <div class="content">${message.content}</div>
                    <div class="time">${formatTime(message.timestamp)}</div>
                `;
            }

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.innerHTML = `<div class="content">${text}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.classList.add('connected');
                text.textContent = `${username} (${room})`;
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Disconnected';
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
        }

        // Typing detection
        document.getElementById('messageInput').addEventListener('input', function(e) {
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                sendTyping();
            }, 300);
        });

        // Enter tugmasi bilan xabar yuborish
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                connect();
            }
        });
    </script>
</body>
</html>
